<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>CyberBuddy | Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
margin:0;
min-height:100vh;

background-image:
linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)),
url("/static/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.glass-card{
background:rgba(15,23,42,0.7);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.stat-number{
font-size:36px;
font-weight:700;
color:#22d3ee;
}

</style>

</head>

<body class="text-white">

<div class="max-w-5xl mx-auto pt-16">

<h1 class="text-4xl font-bold text-center mb-12">
Cyber <span class="text-cyan-400">Buddy</span> Admin Dashboard
</h1>

<!-- STATS GRID -->

<div class="grid grid-cols-2 gap-8">

<div class="glass-card p-10 rounded-2xl text-center">
<h2 class="text-lg mb-3">Total Users</h2>
<p class="stat-number">{{users}}</p>
</div>

<div class="glass-card p-10 rounded-2xl text-center">
<h2 class="text-lg mb-3">URLs Scanned</h2>
<p class="stat-number">{{urls}}</p>
</div>

<div class="glass-card p-10 rounded-2xl text-center">
<h2 class="text-lg mb-3">Malicious URLs</h2>
<p class="stat-number">{{malicious}}</p>
</div>

<div class="glass-card p-10 rounded-2xl text-center">
<h2 class="text-lg mb-3">Safe URLs</h2>
<p class="stat-number">{{safe}}</p>
</div>

</div>

<!-- ADMIN LINKS -->

<div class="text-center mt-14 space-x-6">

<a href="/admin/users"
class="inline-block px-6 py-3 bg-cyan-500 hover:bg-cyan-400 rounded-xl font-semibold transition">
User Management </a>

<a href="/admin/history"
class="inline-block px-6 py-3 bg-cyan-500 hover:bg-cyan-400 rounded-xl font-semibold transition">
URL Scan History </a>

</div>

</div>

</body>
</html>
