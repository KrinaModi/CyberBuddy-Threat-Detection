<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>CyberBuddy | URL Scan History</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
margin:0;
min-height:100vh;

background-image:
linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)),
url("/static/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.glass-card{
background:rgba(15,23,42,0.7);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.safe{
color:#22c55e;
font-weight:600;
}

.malicious{
color:#ef4444;
font-weight:600;
}

</style>

</head>

<body class="text-white">

<div class="max-w-7xl mx-auto pt-16">

<h1 class="text-4xl font-bold text-center mb-10">
URL Scan History
</h1>

<!-- TABLE CARD -->

<div class="glass-card rounded-2xl overflow-hidden">

<table class="w-full text-center">

<thead class="bg-cyan-500/90">

<tr class="text-white">

<th class="py-4">ID</th>
<th>URL / Email</th>
<th>Result</th>
<th>User</th>
<th>Date</th>

</tr>

</thead>

<tbody>

{% for scan in scans %}

<tr class="border-b border-white/10 hover:bg-white/5 transition">

<td class="py-4">{{scan[0]}}</td>

<td class="text-left px-6">{{scan[1]}}</td>

<td>
{% if scan[2] == "Safe" %}
<span class="safe">Safe</span>
{% else %}
<span class="malicious">Malicious</span>
{% endif %}
</td>

<td>{{scan[3]}}</td>

<td>{{scan[4]}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<!-- BACK BUTTON -->

<div class="text-center mt-10">

<a href="/admin/dashboard"
class="inline-block px-6 py-3 bg-cyan-500 hover:bg-cyan-400 rounded-xl font-semibold transition">
⬅ Back to Dashboard </a>

</div>

</div>

</body>
</html>
