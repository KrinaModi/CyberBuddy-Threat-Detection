<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyber Buddy | Register</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .glass-card {
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>

<body class="flex items-center justify-center text-white relative">

<div class="grid-bg"></div>

<div class="glass-card relative z-10 w-full max-w-md p-10 rounded-3xl text-center">

    <h1 class="text-3xl font-bold mb-6">
        Create <span class="text-cyan-400">Account</span>
    </h1>

    {% if message %}
        <p class="text-red-400 mb-4">{{ message }}</p>
    {% endif %}

    <!-- ✅ WORKING FORM -->
    <form method="POST" action="/register" class="space-y-4">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none">

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none">

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm Password"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none">

        <!-- 🔥 IMPORTANT -->
        <button
            type="submit"
            class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 font-semibold text-lg">
            Register
        </button>
    </form>

    <p class="mt-6 text-sm text-gray-500">
        Already have an account?
        <a href="/" class="text-cyan-400 hover:underline">Login</a>
    </p>
</div>

</body>
</html>
