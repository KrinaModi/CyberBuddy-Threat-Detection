<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberBuddy | Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
margin:0;
min-height:100vh;

background-image:
linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)),
url("/static/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

/* grid background */

.grid-bg{
position:absolute;
inset:0;

background-image:
linear-gradient(to right, rgba(0,255,255,0.06) 1px, transparent 1px),
linear-gradient(to bottom, rgba(0,255,255,0.06) 1px, transparent 1px);

background-size:40px 40px;
pointer-events:none;
}

/* glass card */

.glass-card{
background:rgba(15,23,42,0.7);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

/* login button */

.btn-gradient{
background:linear-gradient(90deg,#22d3ee,#3b82f6);
transition:0.3s;
}

.btn-gradient:hover{
transform:scale(1.05);
}

/* logo */

.logo-img{
width:100px;
display:block;
margin:auto;
margin-bottom:8px;
filter:drop-shadow(0 0 6px rgba(34,211,238,0.6));
}

/* title */

.brand-title{
font-size:32px;
font-weight:700;
margin:0;
color:white;
}

.brand-title span{
color:#22d3ee;
}

.brand-subtitle{
color:#94a3b8;
font-size:14px;
margin-top:4px;
}

</style>

</head>

<body class="flex flex-col items-center justify-center text-white relative">

<div class="grid-bg"></div>

<!-- HEADER -->

<div class="text-center mb-8 relative z-10">

<img src="/static/shield.png" class="logo-img">

<h1 class="brand-title">
Cyber<span>Buddy</span>
</h1>

<p class="brand-subtitle">
Welcome back!
</p>

</div>

<!-- LOGIN CARD -->

<div class="glass-card relative z-10 w-full max-w-md p-10 rounded-3xl text-center">

<form method="POST" action="/login" class="space-y-5">

<input
type="text"
name="username"
placeholder="Username"
required
class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition">

<input
type="password"
name="password"
placeholder="Password"
required
class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition">

<div class="text-right text-sm">

<a href="/forgot-password" class="text-cyan-400 hover:underline">
Forgot Password?
</a>

</div>

<button
type="submit"
class="w-full py-4 rounded-xl btn-gradient font-semibold text-lg">

Login

</button>

</form>

<p class="mt-8 text-sm text-gray-400">

New user? <a href="/register" class="text-cyan-400 hover:underline">
Register here </a>

</p>

<p class="mt-4">

<a href="/admin" class="text-cyan-400 text-sm hover:underline">
Admin Login
</a>

</p>

</div>

</body>

</html>
