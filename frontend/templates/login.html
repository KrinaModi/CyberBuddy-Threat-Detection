<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Buddy | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            overflow: hidden;
        }

        /* Subtle Grid Background Overlay */
        .grid-bg {
            position: absolute;
            inset: 0;
            pointer-events: none;  
            z-index: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 40px rgba(0, 255, 170, 0.05);
        }

        .neon-glow:focus {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            border-color: #00f2ff;
        }

        .btn-gradient {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <div class="grid-bg"></div>

    <div class="glass-card relative z-10 w-full max-w-md p-10 rounded-3xl text-center">

        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 mb-4 rounded-2xl bg-cyan-500/10 border border-cyan-500/30">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-white">Cyber <span class="text-cyan-400">Buddy</span></h1>
            <p class="text-sm text-gray-400 mt-2">Secure Link Intelligence</p>
        </div>

<form method="POST" action="/login" class="space-y-5">

    <div>
        <input
            type="text"
            name="username"
            placeholder="Username"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none neon-glow transition-all placeholder:text-gray-500">
    </div>

    <div>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
            class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none neon-glow transition-all placeholder:text-gray-500">
    </div>

    <button
        type="submit"
        class="w-full py-4 rounded-xl btn-gradient font-semibold text-lg uppercase tracking-wider">
        Login
    </button>

</form>


        <p class="mt-8 text-sm text-gray-500">
            New user? <a href="/register" class="text-cyan-400 font-medium hover:underline">
                            Register here
                        </a>

        </p>
    </div>

</body>
</html>
