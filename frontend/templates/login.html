<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBuddy | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0,255,255,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,255,255,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #22d3ee, #3b82f6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(34, 211, 238, 0.4);
        }
        .logo-img {
            width: 100px;
            display: block;
            margin: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-white relative">
    <div class="grid-bg"></div>

    <div class="text-center mb-8 relative z-10">
        <img src="/static/shield.png" class="logo-img" alt="CyberBuddy Logo" onerror="this.style.display='none'">
        <h1 class="text-4xl font-bold m-0 text-white">
            Cyber<span class="text-cyan-400">Buddy</span>
        </h1>
        <p class="text-slate-400 text-sm mt-2">Welcome back!</p>
    </div>

    <div class="glass-card relative z-10 w-full max-w-md p-10 rounded-3xl text-center">
        {% if error %}
            <p class="text-red-400 mb-4">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="text" name="username" placeholder="Username" required
                class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition">
            
            <input type="password" name="password" placeholder="Password" required
                class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition">
            
            <div class="text-right text-sm">
                <a href="/forgot-password" class="text-cyan-400 hover:underline">Forgot Password?</a>
            </div>
            
            <button type="submit" class="w-full py-4 rounded-xl btn-gradient font-semibold text-lg">
                Login
            </button>
        </form>

        <p class="mt-8 text-sm text-gray-400">
            New user? <a href="/register" class="text-cyan-400 hover:underline">Register here</a>
        </p>

        <p class="mt-4">
            <a href="/admin" class="text-cyan-400 text-sm hover:underline">Admin Login</a>
        </p>
    </div>
</body>
</html>
