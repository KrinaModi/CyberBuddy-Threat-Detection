<!DOCTYPE html>
<html>
<head>
    <title>Cyber Buddy</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            padding: 40px;
        }
        .box {
            width: 50%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
        }
        button {
            padding: 10px 20px;
            background-color: #2c7be5;
            color: white;
            border: none;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Cyber Buddy – Threat Detection System</h2>
    <form method="post">
        <textarea name="message" placeholder="Paste email text or URL here..."></textarea>
        <br>
        <button type="submit">Check Threat</button>
    </form>

    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}
</div>

</body>
</html>
