<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>CyberBuddy | Admin Login</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
margin:0;
min-height:100vh;

background-image:
linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)),
url("/static/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;
justify-content:center;
align-items:center;
}

/* glass card */

.glass-card{
background:rgba(15,23,42,0.7);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

.logo-img{
width:100px;
display:block;
margin:auto;
margin-bottom:6px;
filter:drop-shadow(0 0 6px rgba(34,211,238,0.6));
}

</style>

</head>

<body class="text-white">

<div class="flex flex-col items-center">

<!-- HEADER -->

<div class="text-center mb-6">

<img src="/static/shield.png" class="logo-img">

<h1 class="text-3xl font-bold">
Cyber<span class="text-cyan-400">Buddy</span>
</h1>

<p class="text-gray-400 text-sm">
Cyber Security Control Panel
</p>

</div>

<!-- ADMIN CARD -->

<div class="glass-card w-[420px] p-10 rounded-3xl text-center">

<h2 class="text-xl font-semibold mb-6">
Admin Login
</h2>

<form action="/admin/login" method="POST" class="space-y-4">

<input
type="text"
name="username"
placeholder="Admin Username"
required
class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"

>

<input
type="password"
name="password"
placeholder="Password"
required
class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-gray-200 placeholder-gray-400 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition"

>

<button
type="submit"
class="w-full py-4 rounded-xl bg-cyan-500 hover:bg-cyan-400 font-semibold text-lg transition"

>

Admin Login </button>

</form>

<p class="mt-6 text-sm text-gray-400">
<a href="/" class="text-cyan-400 hover:underline">
⬅ Back to User Login
</a>
</p>

</div>

</div>

</body>
</html>
