<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<title>CyberBuddy | User Management</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
font-family:'Outfit',sans-serif;
margin:0;
min-height:100vh;

background-image:
linear-gradient(rgba(5,10,25,0.45), rgba(5,10,25,0.45)),
url("/static/bg.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.glass-card{
background:rgba(15,23,42,0.7);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.1);
box-shadow:0 0 25px rgba(0,0,0,0.6);
}

</style>

</head>

<body class="text-white">

<div class="max-w-6xl mx-auto pt-16">

<h1 class="text-4xl font-bold text-center mb-10">
User Management
</h1>

<!-- TABLE CARD -->

<div class="glass-card rounded-2xl overflow-hidden">

<table class="w-full text-center">

<thead class="bg-cyan-500/90">

<tr class="text-white">

<th class="py-4">ID</th>
<th>Name</th>
<th>Email</th>
<th>Password</th>

</tr>

</thead>

<tbody>

{% for user in users %}

<tr class="border-b border-white/10 hover:bg-white/5 transition">

<td class="py-4">{{user[0]}}</td>
<td>{{user[1]}}</td>
<td>{{user[2]}}</td>
<td>{{user[3]}}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<!-- BACK BUTTON -->

<div class="text-center mt-10">

<a href="/admin/dashboard"
class="inline-block px-6 py-3 bg-cyan-500 hover:bg-cyan-400 rounded-xl font-semibold transition">
⬅ Back to Dashboard </a>

</div>

</div>

</body>
</html>
