<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberBuddy | Verify OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(to right, rgba(0,255,255,0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0,255,255,0.06) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
        }
        .btn-gradient {
            background: linear-gradient(90deg, #22d3ee, #3b82f6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .btn-gradient:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(34, 211, 238, 0.4);
        }
        .logo-img {
            width: 100px;
            display: block;
            margin: auto;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 6px rgba(34, 211, 238, 0.6));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center text-white relative">
    <div class="grid-bg"></div>

    <div class="text-center mb-8 relative z-10">
        <img src="/static/shield.png" class="logo-img" alt="CyberBuddy Logo" onerror="this.style.display='none'">
        <h1 class="text-4xl font-bold m-0 text-white">
            Cyber<span class="text-cyan-400">Buddy</span>
        </h1>
        <p class="text-slate-400 text-sm mt-2">Security Verification</p>
    </div>

    <div class="glass-card relative z-10 w-full max-w-md p-10 rounded-3xl text-center">
        <h2 class="text-xl font-bold mb-2">Verify Your Email</h2>
        <p class="text-slate-400 text-xs mb-6 leading-relaxed">
            A 6-digit OTP code has been generated and sent to your email. Please check your inbox (or spam folder) to retrieve your verification code.
        </p>

        {% if message %}
            <p class="text-rose-400 text-sm mb-4 font-semibold">{{ message }}</p>
        {% endif %}
        
        <form method="POST" action="/verify-otp" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <input type="text" name="otp_code" placeholder="Enter 6-Digit OTP" required maxlength="6" pattern="\d{6}"
                class="w-full px-5 py-4 bg-white/5 border border-white/10 rounded-xl outline-none text-center tracking-[0.5em] text-2xl font-bold text-cyan-300 placeholder-slate-600 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition font-mono">
            
            <button type="submit" class="w-full py-4 rounded-xl btn-gradient font-semibold text-lg">
                Verify & Create Account
            </button>
        </form>

        <p class="mt-6 text-sm text-gray-400">
            Need to change details? <a href="/register" class="text-cyan-400 hover:underline">Go back to Register</a>
        </p>
    </div>
</body>
</html>
